name: Release All

# 全バージョン一括リリース。
# v3.7.3 のようなタグを打つと、1.* の全ブランチをビルドして
# それぞれCurseForge/Modrinthへ配信し、全jarを1つのGitHub Releaseにまとめる。
#
# 注意: mod_versionにハイフンが入ると (例 3.7.2-fix.1) v3.7.2-fix.1 が
# "v*-*" 側にマッチしてしまい、一括のつもりが単一ブランチ扱いになる。
# 一括リリースするバージョン番号にはハイフンを使わないこと。
#
# 失敗したブランチだけやり直す方法 (どちらでもよい):
#   A. 失敗したrunの画面で "Re-run failed jobs"
#   B. Actions → Release All → Run workflow で
#        rerun_failed_of = 失敗したrunのID (URLの /runs/<ID>)  … そのrunで失敗したブランチだけ対象にする
#        または branches = "1.20.4 1.21.1" のように直接指定
#        release_tag     = 既存のタグ (例 v4.0.8)  … 既存のReleaseにjarを追加/上書きする
#        dry_run         = false
# どちらの場合も、Maven Centralに既にあるバージョンは公開をスキップするので二重公開にはならない。
# (CurseForge/Modrinthは判定できないため、そこまで成功していたブランチを対象に含めないこと)
#
# 必要なシークレット: CURSEFORGE_TOKEN, MODRINTH_TOKEN,
#               SONATYPE_USERNAME, SONATYPE_PASSWORD (Central PortalのUser Token),
#               GPG_KEY (armoredの秘密鍵), GPG_PASSPHRASE
on:
  push:
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "CurseForge/Modrinth/Maven Centralへのアップロードを行わない"
        type: boolean
        default: true
      release_tag:
        description: "GitHub Releaseのタグ名 (空ならRelease作成なし / 既存のタグならそのReleaseにjarを追加・上書き)"
        type: string
        default: ""
      branches:
        description: "対象ブランチ (空なら全ブランチ。例: 1.20.4 1.21.1)"
        type: string
        default: ""
      rerun_failed_of:
        description: "このrun IDで失敗したブランチだけを対象にする (branchesより優先)"
        type: string
        default: ""

permissions:
  contents: write
  actions: read # rerun_failed_of で過去のrunのジョブ結果を読むため

concurrency:
  group: release-all
  cancel-in-progress: false

jobs:
  # 対象ブランチと、各ブランチが必要とするJavaバージョンをgradle.propertiesから収集する
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ inputs.branches }}
          RERUN_FAILED_OF: ${{ inputs.rerun_failed_of }}
        run: |
          git fetch --quiet origin "+refs/heads/*:refs/remotes/origin/*"

          # 対象を絞る場合のブランチ一覧 (空なら全ブランチ)
          targets=""
          if [ -n "$RERUN_FAILED_OF" ]; then
            # ジョブ名は "<branch> (java <n>)"。成功以外 (failure/cancelled/skipped) を拾う
            targets="$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$RERUN_FAILED_OF/jobs?per_page=100" \
                        --jq '.jobs[] | select(.conclusion != "success") | .name' \
                        | grep -E '^1\.[^ ]+ \(java ' | cut -d' ' -f1 | sort -u | tr '\n' ' ')"
            echo "failed branches in run $RERUN_FAILED_OF: ${targets:-(none)}"
            [ -n "$targets" ] || { echo "no failed branches to rerun"; exit 1; }
          elif [ -n "$BRANCHES" ]; then
            targets="$(echo "$BRANCHES" | tr ',' ' ')"
          fi

          entries=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
                        | grep -E '^origin/1\.' | sed 's|origin/||' | sort -Vr); do
            if [ -n "$targets" ] && ! echo " $targets " | grep -q " $ref "; then
              continue
            fi
            props="$(git show "origin/$ref:gradle.properties" 2>/dev/null || true)"
            [ -n "$props" ] || { echo "skip $ref (no gradle.properties)"; continue; }
            get() { echo "$props" | grep -E "^$1=" | head -1 | cut -d= -f2- | tr -d '\r'; }
            # java_versionはコンパイルターゲット(options.release)であって
            # Gradleを動かすJDKではない。1.16.5は release=8 だがJDK21上でしかビルドが通らない。
            # --release で下位ターゲットは出せるので、CIは常に21以上を使う
            java="$(get java_version)"
            java="${java:-21}"
            [ "$java" -lt 21 ] 2>/dev/null && java=21
            entries="${entries}{\"branch\":\"$ref\",\"java\":\"$java\",\"minecraft\":\"$(get minecraft_version)\"},"
          done
          [ -n "$entries" ] || { echo "no target branches matched: $targets"; exit 1; }
          matrix="{\"include\":[${entries%,}]}"
          echo "$matrix" | tee /dev/stderr > matrix.json
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1ブランチ失敗しても他は続行する
      # 同時に多くのジョブが依存を取りに行くとMaven Central側が一時的に404/制限を返すことがあるため抑える
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: ${{ matrix.branch }} (java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Collect artifacts
        run: |
          mkdir -p out
          ./gradlew -q printPublishFiles | tr -d '\r' > artifacts.txt
          cat artifacts.txt
          test -s artifacts.txt || { echo "no artifacts found"; exit 1; }
          while read -r f; do
            test -f "$f" || { echo "missing artifact: $f"; exit 1; }
            cp "$f" out/
          done < artifacts.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.branch }}
          path: out/*.jar
          if-no-files-found: error

      # gradle/maven-publish.gradle が無い古いブランチでは publish タスク自体が存在しないのでスキップする
      - name: Check maven publish support
        id: mavenpub
        run: |
          if [ -f gradle/maven-publish.gradle ]; then echo "supported=true" >> "$GITHUB_OUTPUT"; fi

      # やり直し時の二重公開防止: 同じバージョンがCentralに既にあれば公開しない
      # (Centralは同一バージョンの再公開を受け付けないため、そのまま実行すると失敗する)
      - name: Check if already on Maven Central
        id: central
        if: ${{ steps.mavenpub.outputs.supported == 'true' }}
        run: |
          ver="$(grep -E '^mod_version=' info.properties | cut -d= -f2- | tr -d '\r')"
          base="$(grep -E '^archives_base_name=' info.properties | cut -d= -f2- | tr -d '\r')"
          artifact="${base}-common-${{ matrix.minecraft }}"
          url="https://repo1.maven.org/maven2/net/pitan76/${artifact}/${ver}/${artifact}-${ver}.pom"
          if curl -sfI "$url" > /dev/null; then
            echo "already published: $artifact:$ver (skip)"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "not published yet: $artifact:$ver"
          fi

      - name: Publish to Maven Central (deploy + Portalへ引き渡し)
        if: ${{ steps.mavenpub.outputs.supported == 'true' && steps.central.outputs.exists != 'true' && (github.event_name == 'push' || !inputs.dry_run) }}
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishToCentral


      - name: Publish to CurseForge / Modrinth
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods

  release:
    needs: build
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          merge-multiple: true
          path: jars

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          shopt -s nullglob
          jars=(jars/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "no jars to release (all builds failed?)"
            exit 1
          fi
          ls -la jars

          if gh release view "$TAG" > /dev/null 2>&1; then
            # 既存のRelease (やり直し時) にはjarを追加/上書きし、ノートは全assetから作り直す
            echo "release $TAG already exists: uploading ${#jars[@]} jar(s)"
            gh release upload "$TAG" "${jars[@]}" --clobber
            notes=$(gh release view "$TAG" --json assets --jq '.assets[].name' | grep '\.jar$' | sort | sed 's|^|- |')
            gh release edit "$TAG" --notes "$notes"
          else
            notes=$(printf '%s\n' "${jars[@]}" | sed 's|jars/|- |')
            gh release create "$TAG" --title "$TAG" --notes "$notes" "${jars[@]}"
          fi
