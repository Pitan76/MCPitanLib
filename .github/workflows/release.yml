name: Release

# タグを打つとそのタグが指すブランチの内容でリリースする。
# タグ名はMCバージョンを付けること。例: v3.7.3-26.2
#
# Mavenの公開先は Release All と同じ決め方 (手動入力 maven_target → リポジトリ変数 MAVEN_TARGET → central)
#   値: central / github / both / none
#
# 必要なシークレット: CURSEFORGE_TOKEN, MODRINTH_TOKEN,
#               SONATYPE_USERNAME, SONATYPE_PASSWORD (Central PortalのUser Token),
#               GPG_KEY (armoredの秘密鍵), GPG_PASSPHRASE,
#               GH_PACKAGE_TOKEN (PTOM76/maven に packages:write できるトークン。GitHub Packages用)
on:
  push:
    tags:
      - "v*-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "CurseForge/Modrinth/Mavenへのアップロードを行わない"
        type: boolean
        default: true
      release_tag:
        description: "GitHub Releaseを作る場合のタグ名 (空ならRelease作成なし)"
        type: string
        default: ""
      maven_target:
        description: "Mavenの公開先 (空ならリポジトリ変数 MAVEN_TARGET、それも無ければ central)"
        type: choice
        options: ["", central, github, both, none]
        default: ""
      maven_snapshot:
        description: "GitHub Packagesへ -SNAPSHOT 付きで公開する (Maven Centralには使えない)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read gradle.properties
        id: props
        run: |
          get() { grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2- | tr -d '\r'; }
          # java_versionはコンパイルターゲット(options.release)であって
          # Gradleを動かすJDKではない。1.16.5は release=8 だがJDK21上でしかビルドが通らない。
          # --release で下位ターゲットは出せるので、CIは常に21以上を使う
          java="$(get java_version)"
          java="${java:-21}"
          [ "$java" -lt 21 ] 2>/dev/null && java=21
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(get minecraft_version)" >> "$GITHUB_OUTPUT"
          echo "loaders=$(get publish_loaders)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      # build/libsには過去のビルド成果物も残りうるため、Gradleに正確なパスを問い合わせる
      - name: Collect artifacts
        id: artifacts
        run: |
          ./gradlew -q printPublishFiles | tr -d '\r' > artifacts.txt
          echo "--- artifacts ---"
          cat artifacts.txt
          test -s artifacts.txt || { echo "no artifacts found"; exit 1; }
          while read -r f; do
            test -f "$f" || { echo "missing artifact: $f"; exit 1; }
          done < artifacts.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (inputs.release_tag != '' && inputs.release_tag != null)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Minecraft ${{ steps.props.outputs.minecraft }} / ${{ steps.props.outputs.loaders }}" \
            --target "${GITHUB_SHA}" \
            $(cat artifacts.txt | tr '\n' ' ')

      - name: Decide maven target
        id: mavenpub
        env:
          TARGET: ${{ inputs.maven_target != '' && inputs.maven_target || vars.MAVEN_TARGET != '' && vars.MAVEN_TARGET || 'central' }}
          DRY_RUN: ${{ github.event_name != 'push' && inputs.dry_run }}
        run: |
          echo "maven target: $TARGET (dry_run: $DRY_RUN)"
          [ "$DRY_RUN" = "true" ] && exit 0
          case "$TARGET" in
            central) echo "central=true" >> "$GITHUB_OUTPUT" ;;
            github)  echo "github=true" >> "$GITHUB_OUTPUT" ;;
            both)    echo "central=true" >> "$GITHUB_OUTPUT"; echo "github=true" >> "$GITHUB_OUTPUT" ;;
            none)    ;;
            *)       echo "unknown maven target: $TARGET"; exit 1 ;;
          esac

      - name: Publish to Maven Central (deploy + Portalへ引き渡し)
        if: ${{ steps.mavenpub.outputs.central == 'true' }}
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishToCentral

      - name: Publish to GitHub Packages
        if: ${{ steps.mavenpub.outputs.github == 'true' }}
        env:
          GITHUB_ACTOR: PTOM76
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
          SNAPSHOT: ${{ inputs.maven_snapshot || vars.MAVEN_SNAPSHOT == 'true' }}
        run: ./gradlew publishToGitHubPackages -Psnapshot=$SNAPSHOT


      - name: Publish to CurseForge / Modrinth
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods
