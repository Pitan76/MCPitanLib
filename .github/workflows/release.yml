name: Release

# タグを打つとそのタグが指すブランチの内容でリリースする。
# タグ名はMCバージョンを付けること。例: v3.7.3-26.2
#
# 必要なシークレット: CURSEFORGE_TOKEN, MODRINTH_TOKEN
on:
  push:
    tags:
      - "v*-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "CurseForge/Modrinthへのアップロードを行わない"
        type: boolean
        default: true
      release_tag:
        description: "GitHub Releaseを作る場合のタグ名 (空ならRelease作成なし)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read gradle.properties
        id: props
        run: |
          get() { grep -E "^$1=" gradle.properties | head -1 | cut -d= -f2- | tr -d '\r'; }
          # java_versionはコンパイルターゲット(options.release)であって
          # Gradleを動かすJDKではない。1.16.5は release=8 だがJDK21上でしかビルドが通らない。
          # --release で下位ターゲットは出せるので、CIは常に21以上を使う
          java="$(get java_version)"
          java="${java:-21}"
          [ "$java" -lt 21 ] 2>/dev/null && java=21
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(get minecraft_version)" >> "$GITHUB_OUTPUT"
          echo "loaders=$(get publish_loaders)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      # build/libsには過去のビルド成果物も残りうるため、Gradleに正確なパスを問い合わせる
      - name: Collect artifacts
        id: artifacts
        run: |
          ./gradlew -q printPublishFiles | tr -d '\r' > artifacts.txt
          echo "--- artifacts ---"
          cat artifacts.txt
          test -s artifacts.txt || { echo "no artifacts found"; exit 1; }
          while read -r f; do
            test -f "$f" || { echo "missing artifact: $f"; exit 1; }
          done < artifacts.txt

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (inputs.release_tag != '' && inputs.release_tag != null)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Minecraft ${{ steps.props.outputs.minecraft }} / ${{ steps.props.outputs.loaders }}" \
            --target "${GITHUB_SHA}" \
            $(cat artifacts.txt | tr '\n' ' ')

      - name: Publish to CurseForge / Modrinth
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew publishMods
