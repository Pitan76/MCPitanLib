plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.0'
}

def loadProperties(filename) {
    def props = new Properties()
    file(filename).withInputStream {
        props.load(it)
    }
    return props
}

ext.info = loadProperties("$rootDir/info.properties")

version = info.mod_version
group = info.maven_group

base {
    archivesName = info.archives_base_name
}


repositories {
    maven { url "https://maven.pitan76.net/" }
    maven { url "https://maven.shedaniel.me/" }
}

loom {
    accessWidenerPath = file("src/main/resources/mcpitanlib.accesswidener")
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation 'org.yaml:snakeyaml:2.0'
    shadow 'org.yaml:snakeyaml:2.0'

//    api("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
//        exclude(group: "net.fabricmc.fabric-api")
//    }
//    include("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}")

    implementation("net.pitan76:compatdatapacks76-fabric:${rootProject.compatdatapacks76_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation("net.pitan76:legacyitemmodels-fabric:${rootProject.legacyitemmodels_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include("net.pitan76:compatdatapacks76-fabric:${rootProject.compatdatapacks76_version}")
    include("net.pitan76:legacyitemmodels-fabric:${rootProject.legacyitemmodels_version}")
}

processResources {
    inputs.property "version", info.mod_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.fabric_loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": info.mod_version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.fabric_loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

shadowJar {
    relocate "org.yaml.snakeyaml", "net.pitan76.mcpitanlib.shadow.yaml.snakeyaml"
    configurations = [project.configurations.shadow]
    archiveClassifier.set("")
}


jar {
    from("LICENSE") {
        rename { "${it}_${info.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        register("mavenJava", MavenPublication) {
            artifactId = info.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
