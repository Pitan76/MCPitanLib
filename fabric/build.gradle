plugins {
    id "com.gradleup.shadow" version "9.4.0"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    common(project(path: ":common")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    shadowCommon 'org.yaml:snakeyaml:2.0'

    api("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}")

    implementation("net.pitan76:compatdatapacks76-fabric:${rootProject.compatdatapacks76_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation("net.pitan76:legacyitemmodels-fabric:${rootProject.legacyitemmodels_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    implementation("net.pitan76:littleobffallback-fabric:${rootProject.littleobffallback_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include("net.pitan76:compatdatapacks76-fabric:${rootProject.compatdatapacks76_version}")
    include("net.pitan76:legacyitemmodels-fabric:${rootProject.legacyitemmodels_version}")
    include("net.pitan76:littleobffallback-fabric:${rootProject.littleobffallback_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    project.version = project.version + "-fabric"
}

shadowJar {
    relocate "org.yaml.snakeyaml", "net.pitan76.mcpitanlib.shadow.yaml.snakeyaml"

    exclude "architectury.common.json"

    dependsOn(jar)
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set(null)

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    setArchiveClassifier("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

shadow {
    addShadowVariantIntoJavaComponent = false
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = info.archives_base_name + "-" + project.name + "-" + rootProject.minecraft_version
            version = info.mod_version
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/PTOM76/maven")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

tasks.runClient.doFirst {
    def from = new File("../common/src/main/resources/mcpitanlib.accesswidener")
    def to = new File("src/main/resources/mcpitanlib.accesswidener")
    to.bytes = from.bytes
}

tasks.jar.doFirst {
    if (file("src/main/resources/mcpitanlib.accesswidener").exists()) {
        delete file("src/main/resources/mcpitanlib.accesswidener")
    }
}