org.gradle.jvmargs=-Xmx3G

minecraft_version=1.20.1
java_version=17

# https://www.curseforge.com/minecraft/mc-mods/architectury-api
architectury_version=9.2.14

# https://fabricmc.net/develop/
fabric_loader_version=0.18.6
yarn_mappings=1.20.1+build.10
fabric_api_version=0.92.7+1.20.1

# https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=1.20.1-47.0.1

# https://lambdaurora.dev/tools/import_quilt.html
quilt_loader_version=0.19.0-beta.18
quilt_fabric_api_version=6.0.2
team_reborn_energy_version=4.1.0

cloth_config_version=11.1.118

fabricEnabled=true
forgeEnabled=true
quiltEnabled=false

publish_jar_task=remapJar
publish_loaders=fabric,forge
game_versions=1.20,1.20.1
# STABLE / BETA / ALPHA
release_type=STABLE
required_deps=architectury-api
required_deps_fabric=fabric-api
embedded_deps=cloth-config

org.gradle.parallel=true
org.gradle.workers.max=4