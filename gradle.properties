org.gradle.jvmargs=-Xmx3G

minecraft_version=1.21.3
java_version=21

# https://www.curseforge.com/minecraft/mc-mods/architectury-api
architectury_version=14.0.4

# https://fabricmc.net/develop/
fabric_loader_version=0.18.6
yarn_mappings=1.21.3+build.2
fabric_api_version=0.107.3+1.21.3

# https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=1.21.3-53.0.11

# https://lambdaurora.dev/tools/import_quilt.html
quilt_loader_version=0.23.1
quilt_fabric_api_version=6.0.2

# https://projects.neoforged.net/neoforged/neoforge
neoforge_version=21.3.16-beta

cloth_config_version=16.0.141

# https://maven.pitan76.net/net/pitan76/compatdatapacks76/
compatdatapacks76_version=1.0.13.213

fabricEnabled=true
forgeEnabled=false
quiltEnabled=false
neoforgeEnabled=true

publish_jar_task=remapJar
publish_loaders=fabric,neoforge
game_versions=1.21.2,1.21.3
# STABLE / BETA / ALPHA
release_type=STABLE
required_deps=
required_deps_fabric=fabric-api
embedded_deps=cloth-config,compatdatapacks

org.gradle.parallel=true
org.gradle.workers.max=4