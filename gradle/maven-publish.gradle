// Maven Central (Sonatype) への publish 設定 (全サブプロジェクト共通)
//
// 各サブプロジェクトの build.gradle に publishing ブロックを書くと
// fabric だけ直して neoforge を忘れる、という事故が起きるためここに集約する。
// プラットフォーム固有の差 (shadowJar を outgoing に差し替える等) は
// 各 build.gradle の configurations {} 側で吸収済みなので、publish 設定に差分は不要。
//
// 認証情報:
//   sonatype.user / sonatype.key   (または env SONATYPE_USERNAME / SONATYPE_PASSWORD)
// 署名鍵 (上から順に探す。いずれも無ければ gpg コマンドにフォールバック):
//   env GPG_KEY             … armored秘密鍵そのもの。CI用
//   signing.keyFile         … armored秘密鍵(.asc)のパス。マシン固有なので
//                             ~/.gradle/gradle.properties に絶対パスで書くこと
//                             (repoのgradle.propertiesは ${} を展開しないので注意)
// パスフレーズ: signing.password プロパティ または env GPG_PASSPHRASE

def resolveSigningKey = { Project p ->
    def env = System.getenv("GPG_KEY")
    if (env) return env

    def path = p.findProperty("signing.keyFile")
    if (!path) return null

    def f = p.file(path)
    if (!f.exists()) throw new GradleException("signing.keyFile not found: ${f}")
    return f.text
}

subprojects {
    apply plugin: "maven-publish"
    apply plugin: "signing"

    // mavenFabric / mavenNeoforge / mavenCommon
    def pubName = "maven" + name.capitalize()

    publishing {
        publications {
            create(pubName, MavenPublication) {
                artifactId = rootProject.info.archives_base_name + "-" + project.name + "-" + rootProject.minecraft_version
                version = rootProject.info.mod_version

                // withSourcesJar()/withJavadocJar() で作った jar も components.java に含まれるため
                // artifact(sourcesJar) 等を重ねて書くと "already added" で publish が落ちる
                from components.java

                pom {
                    name = "MCPitanLib (" + project.name + ")"
                    description = "Pitan's Minecraft Mod Library (Cross-version/platform)"
                    url = "https://github.com/pitan76/mcpitanlib"
                    licenses {
                        license {
                            name = "MIT License"
                            url = "https://opensource.org/licenses/MIT"
                        }
                    }
                    developers {
                        developer {
                            id = "pitan76"
                            name = "Pitan76"
                            email = "admin@pitan76.net"
                        }
                    }
                    scm {
                        connection = "scm:git:git://github.com/pitan76/mcpitanlib.git"
                        developerConnection = "scm:git:ssh://github.com/pitan76/mcpitanlib.git"
                        url = "https://github.com/pitan76/mcpitanlib"
                    }

                    // Maven Central は SNAPSHOT 依存を含むリリースを拒否する。
                    // ここに載るのは include() した jar-in-jar 依存 (compatdatapacks76 等) で、
                    // 実際にはjarに同梱済み＝利用者側の解決は不要なので pom から落とす。
                    withXml {
                        def deps = asNode().dependencies
                        if (deps.isEmpty()) return

                        deps[0].dependency
                                .findAll { it.version.text().endsWith("-SNAPSHOT") }
                                .each {
                                    logger.lifecycle("[${project.name}] drop SNAPSHOT dep from pom: "
                                            + it.groupId.text() + ":" + it.artifactId.text() + ":" + it.version.text())
                                    deps[0].remove(it)
                                }
                    }
                }
            }
        }

        repositories {
            maven {
                name = "sonatype"
                // Central Portal の /api/v1/publish はバンドルアップロードAPIであって
                // Mavenリポジトリではないので maven-publish からは叩けない。
                // OSSRH Staging API 互換エンドポイントに deploy し、Portal側で publish する。
                url = uri("https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/")
                credentials {
                    username = project.findProperty("sonatype.user") ?: System.getenv("SONATYPE_USERNAME")
                    password = project.findProperty("sonatype.key") ?: System.getenv("SONATYPE_PASSWORD")
                }
            }
        }
    }

    signing {
        def key = resolveSigningKey(project)
        def pass = project.findProperty("signing.password") ?: System.getenv("GPG_PASSPHRASE")

        // Central へ上げるときだけ署名必須。ローカルの build / publishToMavenLocal は鍵無しでも通す
        required = { gradle.taskGraph.allTasks.any { it.name.toLowerCase().contains("sonatype") } }

        // パスフレーズ無しで useInMemoryPgpKeys を呼ぶと秘密鍵の復号に失敗し
        // signatory 生成時 (onlyIf評価中) に例外が飛ぶため、揃っているときだけ設定する
        if (key && pass) {
            useInMemoryPgpKeys(key, pass)
        } else if (!key) {
            useGpgCmd()
        }

        sign publishing.publications[pubName]
    }

    // pomからSNAPSHOT依存を削っても .module 側には残るため、
    // 食い違ったメタデータを出さないようGradle Module Metadataは publish しない
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    tasks.withType(Sign).configureEach {
        onlyIf { gradle.taskGraph.allTasks.any { it.name.toLowerCase().contains("sonatype") } }
    }
}
